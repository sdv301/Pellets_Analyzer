{% extends "base_public.html" %}

{% block title %}Email подтверждён — Pellets Analyzer{% endblock %}

{% block content %}
<section class="min-h-[75vh] flex items-center justify-center py-16 px-4 sm:px-6">
  <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-2xl shadow-xl p-8 sm:p-10 text-center space-y-6">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 text-3xl shadow-inner">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="space-y-2">
      <h1 class="text-2xl font-bold tracking-tight text-heading sm:text-3xl">
        Email подтверждён!
      </h1>
      <p class="text-sm text-muted">
        Ваша учетная запись успешно активирована. Теперь вы можете войти в систему и пользоваться всеми функциями Pellets Analyzer.
      </p>
    </div>
    <div class="pt-2">
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary w-full py-3 shadow-md shadow-blue-500/10">
        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i>Войти в систему
      </a>
    </div>
  </div>
</section>
{% endblock %}
